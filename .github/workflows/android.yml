name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Remove global.json
        run: rm -f global.json

      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install .NET workloads
        run: dotnet workload install maui-android

      - name: Run patch script
        run: python3 patch.py

      - name: Restore
        run: dotnet restore src/BD.WTTS.Client.Android/BD.WTTS.Client.Android.csproj -p:SignatureValidationMode=accept

      - name: Publish APK
        run: |
          dotnet publish src/BD.WTTS.Client.Android/BD.WTTS.Client.Android.csproj \
            -f net11.0-android -c Release \
            -p:AndroidPackageFormats=apk \
            -p:RuntimeIdentifier=android-arm64 \
            -p:AndroidKeyStore=false \
            -p:SignatureValidationMode=accept \
            -o ./publish/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamTools-Android-APK
          path: ./publish/android/*.apk
          if-no-files-found: error