name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install .NET workloads
        run: dotnet workload install maui-android

      # 1. 修改共享库的 TFM 配置，让 Linux 环境也生成 android 目标
      - name: Patch TFM props
        run: |
          sed -i "s|<TargetFrameworks Condition=\"\$(\[MSBuild\]::IsOSPlatform('linux'))\">\$(TargetFrameworks)</TargetFrameworks>|<TargetFrameworks Condition=\"\$(\[MSBuild\]::IsOSPlatform('linux'))\">\$(TargetFrameworks);net\$(DotNet_Version)-android</TargetFrameworks>|" src/TFM_NETX_WITH_ALL.props
          echo "--- TFM props after patch ---"
          grep "linux" -A2 src/TFM_NETX_WITH_ALL.props

      # 2. 修改共享库 csproj：排除 Android 不支持的包和引用
      - name: Patch shared library csproj
        run: |
          # 给 System.Drawing.Common 加 Windows 条件
          sed -i 's|<PackageReference Include="System.Drawing.Common" />|<PackageReference Include="System.Drawing.Common" Condition="$([MSBuild]::GetTargetPlatformIdentifier('\''$(TargetFramework)'\'')) == '\''windows'\''" />|' src/BD.WTTS.Client/BD.WTTS.Client.csproj
          # 给 WinAuth 加非 Android 条件
          sed -i 's|<ProjectReference Include="..\\..\\ref\\WinAuth\\src\\WinAuth\\WinAuth.csproj" />|<ProjectReference Include="..\\..\\ref\\WinAuth\\src\\WinAuth\\WinAuth.csproj" Condition="$([MSBuild]::GetTargetPlatformIdentifier('\''$(TargetFramework)'\'')) != '\''android'\''" />|' src/BD.WTTS.Client/BD.WTTS.Client.csproj

      # 3. 动态创建 Android 头项目
      - name: Create Android head project
        run: |
          cd src
          dotnet new maui -n BD.WTTS.Client.Android --force

      # 4. 用自定义 csproj 覆盖模板生成的（只保留 Android，引用共享库）
      - name: Overwrite Android csproj
        run: |
          cat > src/BD.WTTS.Client.Android/BD.WTTS.Client.Android.csproj << 'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0-android</TargetFramework>
              <OutputType>Exe</OutputType>
              <RootNamespace>BD.WTTS.Client.Android</RootNamespace>
              <UseMaui>true</UseMaui>
              <SingleProject>true</SingleProject>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <ApplicationTitle>SteamTools</ApplicationTitle>
              <ApplicationId>com.bd.wtts.client.android</ApplicationId>
              <ApplicationDisplayVersion>1.0</ApplicationDisplayVersion>
              <ApplicationVersion>1</ApplicationVersion>
              <SupportedOSPlatformVersion Condition="$([MSBuild]::GetTargetPlatformIdentifier('$(TargetFramework)')) == 'android'">24.0</SupportedOSPlatformVersion>
            </PropertyGroup>
            <ItemGroup>
              <MauiIcon Include="Resources\AppIcon\appicon.svg" ForegroundFile="Resources\AppIcon\appiconfg.svg" Color="#512BD4" />
              <MauiSplashScreen Include="Resources\Splash\splash.svg" Color="#512BD4" BaseSize="128,128" />
              <MauiImage Include="Resources\Images\*" />
              <MauiImage Update="Resources\Images\dotnet_bot.png" Resize="True" BaseSize="300,185" />
              <MauiFont Include="Resources\Fonts\*" />
              <MauiAsset Include="Resources\Raw\**" LogicalName="%(RecursiveDir)%(Filename)%(Extension)" />
            </ItemGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.Maui.Controls" Version="$(MauiVersion)" />
              <PackageReference Include="Microsoft.Extensions.Logging.Debug" Version="10.0.0" />
            </ItemGroup>
            <ItemGroup>
              <ProjectReference Include="..\BD.WTTS.Client\BD.WTTS.Client.csproj" />
            </ItemGroup>
          </Project>
          EOF

      # 5. 恢复依赖并发布 APK
      - name: Restore
        run: dotnet restore src/BD.WTTS.Client.Android/BD.WTTS.Client.Android.csproj

      - name: Publish APK
        run: |
          dotnet publish src/BD.WTTS.Client.Android/BD.WTTS.Client.Android.csproj \
            -f net10.0-android -c Release \
            -p:AndroidPackageFormats=apk \
            -p:RuntimeIdentifier=android-arm64 \
            -p:AndroidKeyStore=false \
            -o ./publish/android

      # 6. 上传 APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamTools-Android-APK
          path: ./publish/android/*.apk
          if-no-files-found: error